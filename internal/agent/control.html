<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClipHub Devices</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.45 system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { width: min(920px, calc(100% - 32px)); margin: 40px auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { font-size:28px; margin:0; } h2 { margin-top:36px; font-size:18px; }
    button { border:0; border-radius:8px; padding:9px 14px; background:#2563eb; color:white; cursor:pointer; }
    .muted { color:GrayText; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .device,.transfer { border:1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius:12px; padding:16px; background:color-mix(in srgb, Canvas 94%, CanvasText 6%); }
    .device { min-height:100px; transition:.15s ease; } .device.drag { border-color:#2563eb; background:color-mix(in srgb, #2563eb 14%, Canvas); transform:translateY(-2px); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#9ca3af; margin-right:6px; } .online { background:#22c55e; }
    .transfer { margin-bottom:10px; } .actions { display:flex; gap:8px; margin-top:12px; }
    .secondary { background:color-mix(in srgb, CanvasText 14%, Canvas); color:CanvasText; }
    #notice { min-height:24px; margin:16px 0; color:#2563eb; }
  </style>
</head>
<body>
<main>
  <header><div><h1>ClipHub</h1><div class="muted">Drop files onto a device and walk away.</div></div><button id="pause">Pause clipboard</button></header>
  <div id="notice"></div>
  <h2>Devices</h2><section id="devices" class="grid"></section>
  <h2>Transfers</h2><section id="transfers"></section>
</main>
<script>
let state;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url, options={}) {
  const response=await fetch(url, options); const body=await response.json();
  if(!response.ok) throw new Error(body.error||response.statusText); return body;
}
async function refresh() {
  try { state=await request('/api/state'); render(); } catch(error) { notice(error.message,true); }
}
function render() {
  pause.textContent=state.paused?'Resume clipboard':'Pause clipboard';
  devices.innerHTML=state.devices.filter(d=>d.device_id!==state.device_id).map(d=>`
    <article class="device" data-id="${esc(d.device_id)}">
      <div class="row"><strong>${esc(d.name)}</strong><span class="muted"><i class="dot ${d.online?'online':''}"></i>${d.online?'online':'offline'}</span></div>
      <div class="muted">${esc(d.platform)} · ${esc(d.device_id).slice(0,8)}</div>
      <div class="muted" style="margin-top:18px">Drop files here</div>
    </article>`).join('')||'<div class="muted">No other registered devices.</div>';
  for(const card of document.querySelectorAll('.device')) {
    card.ondragover=e=>{e.preventDefault();card.classList.add('drag')};
    card.ondragleave=()=>card.classList.remove('drag');
    card.ondrop=e=>{e.preventDefault();card.classList.remove('drag');send(card.dataset.id,e.dataTransfer.files)};
  }
  transfers.innerHTML=state.transfers.map(t=>{
    const incoming=t.to_device===state.device_id, offered=incoming&&t.state==='offered';
    const names=t.files.map(f=>esc(f.name)).join(', ');
    const total=t.files.reduce((n,f)=>n+f.size,0), uploaded=t.files.reduce((n,f)=>n+f.uploaded,0);
    const progress=total?Math.round(uploaded*100/total):100;
    return `<article class="transfer"><div class="row"><strong>${names}</strong><span>${esc(t.state)}</span></div>
      <div class="muted">${incoming?'From '+esc(t.from_device):'To '+esc(t.to_device)} · ${t.files.length} file(s) · ${progress}% uploaded</div>
      ${offered?`<div class="actions"><button onclick="transferAction('${esc(t.transfer_id)}','accept')">Accept</button><button class="secondary" onclick="transferAction('${esc(t.transfer_id)}','decline')">Decline</button></div>`:''}
      ${incoming&&t.state==='complete'?`<div class="actions"><button class="secondary" onclick="reveal()">Show in folder</button></div>`:''}</article>`;
  }).join('')||'<div class="muted">No transfers yet.</div>';
}
async function send(device, files) {
  if(!files.length)return; const form=new FormData(); for(const file of files)form.append('files',file);
  notice(`Sending ${files.length} file(s)…`);
  try { const transfer=await request('/api/send?to='+encodeURIComponent(device),{method:'POST',body:form}); notice(`Offered transfer ${transfer.transfer_id}.`); await refresh(); }
  catch(error){notice(error.message,true)}
}
async function transferAction(id,action) {
  try { await request(`/api/transfers/${encodeURIComponent(id)}/${action}`,{method:'POST'}); notice(action==='accept'?'Receiving in the background…':'Transfer declined.'); setTimeout(refresh,500); }
  catch(error){notice(error.message,true)}
}
async function reveal(){try{await request('/api/reveal',{method:'POST'})}catch(error){notice(error.message,true)}}
function notice(message,error=false){document.querySelector('#notice').textContent=message;document.querySelector('#notice').style.color=error?'#dc2626':'#2563eb'}
document.querySelector('#pause').onclick=async()=>{try{await request('/api/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paused:!state.paused})});await refresh()}catch(error){notice(error.message,true)}};
refresh(); setInterval(refresh,3000);
</script>
</body>
</html>
