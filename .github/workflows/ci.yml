name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Mac engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
      - working-directory: android
        run: ./gradlew test lint assembleDebug

  apple:
    name: Apple apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: brew install xcodegen
      - run: make tailboard-engine-app
      - working-directory: ios
        run: xcodegen generate
      - name: Build macOS host
        working-directory: ios
        run: |
          xcodebuild \
            -project TGClipboard.xcodeproj \
            -scheme TailboardMacHost \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath ../.derived-data-ci-macos \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test iOS app
        working-directory: ios
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["isAvailable"]))')"
          xcodebuild \
            -project TGClipboard.xcodeproj \
            -scheme TGClipboard \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO \
            test
