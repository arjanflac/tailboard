name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Mac engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
      - working-directory: android
        run: ./gradlew test lint assembleDebug assembleDebugAndroidTest

  mac-app:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: brew install xcodegen
      - run: make tailboard-engine-app
      - working-directory: macos
        run: xcodegen generate
      - name: Build macOS host
        working-directory: macos
        run: |
          xcodebuild \
            -project Tailboard.xcodeproj \
            -scheme Tailboard \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath ../.derived-data-ci-macos \
            CODE_SIGNING_ALLOWED=NO \
            build
