name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go test
        run: go test ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go vet
        run: go vet ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go test -race
        run: make test-race

  smoke-build:
    name: Smoke Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build shipped binaries
        run: go build ./cmd/tg-clipd ./cmd/tg-clipboard ./cmd/tg-clip

  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build deterministic release artifacts
        run: make release VERSION=ci-snapshot
      - name: Verify release artifacts
        run: make release-verify VERSION=ci-snapshot
      - name: Generate package-manager metadata
        run: make release-package-managers VERSION=ci-snapshot RELEASE_ASSET_BASE_URL=https://github.com/thalysguimaraes/tg-clipboard/releases/download/ci-snapshot
      - name: Verify package-manager metadata
        run: make release-package-managers-verify VERSION=ci-snapshot RELEASE_ASSET_BASE_URL=https://github.com/thalysguimaraes/tg-clipboard/releases/download/ci-snapshot

  ios-ci:
    name: iOS Build and Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test without signing
        working-directory: ios
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["isAvailable"]))')"
          xcodebuild \
            -project TGClipboard.xcodeproj \
            -scheme TGClipboard \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO \
            test
