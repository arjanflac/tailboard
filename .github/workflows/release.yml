name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go test
        run: go test ./...

      - name: Build deterministic release assets
        run: make release VERSION=${{ github.ref_name }}

      - name: Verify release assets
        run: make release-verify VERSION=${{ github.ref_name }}

      - name: Publish core GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="dist/release/tg-clipboard_${RELEASE_TAG}_release_notes.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --verify-tag
          fi

      - name: Generate package-manager metadata from published release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          manifest_url="https://github.com/thalysguimaraes/tg-clipboard/releases/download/${RELEASE_TAG}/tg-clipboard_${RELEASE_TAG}_artifacts.json"
          checksums_url="https://github.com/thalysguimaraes/tg-clipboard/releases/download/${RELEASE_TAG}/tg-clipboard_${RELEASE_TAG}_checksums.txt"

          make release-package-managers \
            VERSION="${RELEASE_TAG}" \
            RELEASE_MANIFEST="${manifest_url}" \
            RELEASE_CHECKSUMS="${checksums_url}"

      - name: Verify package-manager metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          manifest_url="https://github.com/thalysguimaraes/tg-clipboard/releases/download/${RELEASE_TAG}/tg-clipboard_${RELEASE_TAG}_artifacts.json"
          checksums_url="https://github.com/thalysguimaraes/tg-clipboard/releases/download/${RELEASE_TAG}/tg-clipboard_${RELEASE_TAG}_checksums.txt"

          make release-package-managers-verify \
            VERSION="${RELEASE_TAG}" \
            RELEASE_MANIFEST="${manifest_url}" \
            RELEASE_CHECKSUMS="${checksums_url}"

      - name: Publish package-manager metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find dist/release/package-managers -type f -print0 | sort -z)
          if [ "${#files[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          fi

      - name: Publish Homebrew tap
        if: ${{ secrets.PACKAGE_REPOS_TOKEN != '' && vars.HOMEBREW_TAP_REPOSITORY != '' }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo_dir="$(mktemp -d)"
          gh repo clone "$TAP_REPOSITORY" "$repo_dir"
          mkdir -p "$repo_dir/Formula"
          cp dist/release/package-managers/homebrew/*.rb "$repo_dir/Formula/"
          git -C "$repo_dir" config user.name "github-actions[bot]"
          git -C "$repo_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo_dir" add Formula
          if ! git -C "$repo_dir" diff --cached --quiet; then
            git -C "$repo_dir" commit -m "tg-clipboard ${RELEASE_TAG}"
            git -C "$repo_dir" push
          fi

      - name: Publish Scoop bucket
        if: ${{ secrets.PACKAGE_REPOS_TOKEN != '' && vars.SCOOP_BUCKET_REPOSITORY != '' }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          BUCKET_REPOSITORY: ${{ vars.SCOOP_BUCKET_REPOSITORY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo_dir="$(mktemp -d)"
          gh repo clone "$BUCKET_REPOSITORY" "$repo_dir"
          mkdir -p "$repo_dir/bucket"
          cp dist/release/package-managers/scoop/*.json "$repo_dir/bucket/"
          git -C "$repo_dir" config user.name "github-actions[bot]"
          git -C "$repo_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo_dir" add bucket
          if ! git -C "$repo_dir" diff --cached --quiet; then
            git -C "$repo_dir" commit -m "tg-clipboard ${RELEASE_TAG}"
            git -C "$repo_dir" push
          fi
