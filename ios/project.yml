name: TGClipboard
options:
  bundleIdPrefix: com.thalys
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5"
  DEVELOPMENT_TEAM: ""  # Set your Apple Developer Team ID here

targets:
  TGClipboardKit:
    type: framework
    platform: iOS
    sources:
      - TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard.kit
      INFOPLIST_FILE: TGClipboardKit/Info.plist

  TGClipboard:
    type: application
    platform: iOS
    sources:
      - TGClipboard
    dependencies:
      - target: TGClipboardKit
      - target: TGPasteKeyboard
        embed: true
      - target: TGClipboardShare
        embed: true
      - target: TGClipboardWidget
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard
      INFOPLIST_FILE: TGClipboard/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TGClipboard/TGClipboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  TGPasteKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TGPasteKeyboard
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard.keyboard
      INFOPLIST_FILE: TGPasteKeyboard/Info.plist
    entitlements:
      path: TGPasteKeyboard/TGPasteKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  TGClipboardShare:
    type: app-extension
    platform: iOS
    sources:
      - TGClipboardShare
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard.share
      INFOPLIST_FILE: TGClipboardShare/Info.plist
    entitlements:
      path: TGClipboardShare/TGClipboardShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  TGClipboardWidget:
    type: app-extension
    platform: iOS
    sources:
      - TGClipboardWidget
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard.widget
      INFOPLIST_FILE: TGClipboardWidget/Info.plist
      APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: TGClipboardWidget/TGClipboardWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  TGClipboardKitMac:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TGClipboardKit
        excludes:
          - "Models/TGClipboardActivityAttributes.swift"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard.kit.mac
      PRODUCT_NAME: TGClipboardKit
      PRODUCT_MODULE_NAME: TGClipboardKit
      INFOPLIST_FILE: TGClipboardKit/Info.plist

  TGClipboardMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../macos/TGClipboardMenuBar
    dependencies:
      - target: TGClipboardKitMac
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard.menubar
      PRODUCT_NAME: TGClipboard
      INFOPLIST_FILE: ../macos/TGClipboardMenuBar/Info.plist
      ENABLE_HARDENED_RUNTIME: false

  TGClipboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TGClipboardTests
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.tgclipboard.tests

schemes:
  TGClipboard:
    build:
      targets:
        TGClipboard: all
        TGClipboardTests: [test]
    test:
      targets:
        - TGClipboardTests
  TGClipboardMenuBar:
    build:
      targets:
        TGClipboardMenuBar: all
