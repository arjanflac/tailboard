name: TGClipboard
options:
  bundleIdPrefix: com.arjanflac
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5"

targets:
  TGClipboardKit:
    type: framework
    platform: iOS
    sources:
      - TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.kit
      INFOPLIST_FILE: TGClipboardKit/Info.plist

  TGClipboard:
    type: application
    platform: iOS
    sources:
      - TGClipboard
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard
      INFOPLIST_FILE: TGClipboard/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TGClipboard/TGClipboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arjanflac.tgclipboard
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.arjanflac.tgclipboard

  TailboardMacHost:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../macos/TailboardMacHost
      - path: ../.tailboard-build/macos/Tailboard Engine.app
        optional: true
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LoginItems
    dependencies:
      - sdk: CoreServices.framework
      - sdk: ServiceManagement.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tailboard.host
      PRODUCT_NAME: Tailboard
      MARKETING_VERSION: 1.8
      CURRENT_PROJECT_VERSION: 9
      INFOPLIST_FILE: ../macos/TailboardMacHost/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: true

  TGClipboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TGClipboardTests
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.tests
      GENERATE_INFOPLIST_FILE: true

schemes:
  TGClipboard:
    build:
      targets:
        TGClipboard: all
        TGClipboardTests: [test]
    test:
      targets:
        - TGClipboardTests
  TailboardMacHost:
    build:
      targets:
        TailboardMacHost: all
