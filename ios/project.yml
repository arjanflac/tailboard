name: ClipHub
options:
  bundleIdPrefix: com.thalys
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5"
  DEVELOPMENT_TEAM: ""  # Set your Apple Developer Team ID here

targets:
  ClipHubKit:
    type: framework
    platform: iOS
    sources:
      - ClipHubKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub.kit
      INFOPLIST_FILE: ClipHubKit/Info.plist

  ClipHub:
    type: application
    platform: iOS
    sources:
      - ClipHub
    dependencies:
      - target: ClipHubKit
      - target: TailPasteKeyboard
        embed: true
      - target: TailClipShare
        embed: true
      - target: ClipHubWidget
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub
      INFOPLIST_FILE: ClipHub/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: ClipHub/ClipHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  TailPasteKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TailPasteKeyboard
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: ClipHubKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub.keyboard
      INFOPLIST_FILE: TailPasteKeyboard/Info.plist
    entitlements:
      path: TailPasteKeyboard/TailPasteKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  TailClipShare:
    type: app-extension
    platform: iOS
    sources:
      - TailClipShare
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: ClipHubKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub.share
      INFOPLIST_FILE: TailClipShare/Info.plist
    entitlements:
      path: TailClipShare/TailClipShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  ClipHubWidget:
    type: app-extension
    platform: iOS
    sources:
      - ClipHubWidget
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: ClipHubKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub.widget
      INFOPLIST_FILE: ClipHubWidget/Info.plist
      APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: ClipHubWidget/ClipHubWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thalys.cliphub
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.thalys.cliphub

  ClipHubKitMac:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClipHubKit
        excludes:
          - "Models/ClipHubActivityAttributes.swift"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub.kit.mac
      PRODUCT_NAME: ClipHubKit
      PRODUCT_MODULE_NAME: ClipHubKit
      INFOPLIST_FILE: ClipHubKit/Info.plist

  ClipHubMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../macos/ClipHubMenuBar
    dependencies:
      - target: ClipHubKitMac
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub.menubar
      PRODUCT_NAME: ClipHub
      INFOPLIST_FILE: ../macos/ClipHubMenuBar/Info.plist
      ENABLE_HARDENED_RUNTIME: false

  ClipHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipHubTests
    dependencies:
      - target: ClipHubKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thalys.cliphub.tests

schemes:
  ClipHub:
    build:
      targets:
        ClipHub: all
        ClipHubTests: [test]
    test:
      targets:
        - ClipHubTests
  ClipHubMenuBar:
    build:
      targets:
        ClipHubMenuBar: all
