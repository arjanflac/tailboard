name: TGClipboard
options:
  bundleIdPrefix: com.arjanflac
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5"

targets:
  TGClipboardKit:
    type: framework
    platform: iOS
    sources:
      - TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.kit
      INFOPLIST_FILE: TGClipboardKit/Info.plist

  TGClipboard:
    type: application
    platform: iOS
    sources:
      - TGClipboard
    dependencies:
      - target: TGClipboardKit
      - target: TGPasteKeyboard
        embed: true
      - target: TGClipboardShare
        embed: true
      - target: TGClipboardWidget
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard
      INFOPLIST_FILE: TGClipboard/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TGClipboard/TGClipboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arjanflac.tgclipboard
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.arjanflac.tgclipboard

  TGPasteKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TGPasteKeyboard
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.keyboard
      INFOPLIST_FILE: TGPasteKeyboard/Info.plist
    entitlements:
      path: TGPasteKeyboard/TGPasteKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arjanflac.tgclipboard
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.arjanflac.tgclipboard

  TGClipboardShare:
    type: app-extension
    platform: iOS
    sources:
      - TGClipboardShare
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.share
      INFOPLIST_FILE: TGClipboardShare/Info.plist
    entitlements:
      path: TGClipboardShare/TGClipboardShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arjanflac.tgclipboard
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.arjanflac.tgclipboard

  TGClipboardWidget:
    type: app-extension
    platform: iOS
    sources:
      - TGClipboardWidget
      - path: SharedAssets/ExtensionAssets.xcassets
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.widget
      INFOPLIST_FILE: TGClipboardWidget/Info.plist
      APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: TGClipboardWidget/TGClipboardWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arjanflac.tgclipboard
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.arjanflac.tgclipboard

  TGClipboardKitMac:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TGClipboardKit
        excludes:
          - "Models/TGClipboardActivityAttributes.swift"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.kit.mac
      PRODUCT_NAME: TGClipboardKit
      PRODUCT_MODULE_NAME: TGClipboardKit
      INFOPLIST_FILE: TGClipboardKit/Info.plist

  TGClipboardMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../macos/TGClipboardMenuBar
      - path: ../.tailboard-build/macos/Tailboard Engine.app
        optional: true
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LoginItems
    dependencies:
      - target: TGClipboardKitMac
        embed: true
      - target: TailboardShareMac
        embed: true
      - sdk: CoreServices.framework
      - sdk: ServiceManagement.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.menubar
      PRODUCT_NAME: Tailboard
      MARKETING_VERSION: 1.2
      CURRENT_PROJECT_VERSION: 3
      INFOPLIST_FILE: ../macos/TGClipboardMenuBar/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: true

  TailboardShareMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../macos/TailboardShare
      - path: ../macos/TGClipboardMenuBar/ControlClient.swift
    dependencies:
      - target: TGClipboardKitMac
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.menubar.share
      PRODUCT_NAME: TailboardShare
      PRODUCT_MODULE_NAME: TailboardShare
      MARKETING_VERSION: 1.2
      CURRENT_PROJECT_VERSION: 3
      INFOPLIST_FILE: ../macos/TailboardShare/Info.plist
      ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: ../macos/TailboardShare/TailboardShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true

  TGClipboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TGClipboardTests
    dependencies:
      - target: TGClipboardKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tgclipboard.tests
      GENERATE_INFOPLIST_FILE: true

schemes:
  TGClipboard:
    build:
      targets:
        TGClipboard: all
        TGClipboardTests: [test]
    test:
      targets:
        - TGClipboardTests
  TGClipboardMenuBar:
    build:
      targets:
        TGClipboardMenuBar: all
