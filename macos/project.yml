name: Tailboard
options:
  bundleIdPrefix: com.arjanflac
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5"

targets:
  Tailboard:
    type: application
    platform: macOS
    sources:
      - path: TailboardMacHost
      - path: ../.tailboard-build/macos/Tailboard Engine.app
        optional: true
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LoginItems
    dependencies:
      - sdk: CoreServices.framework
      - sdk: ServiceManagement.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arjanflac.tailboard.host
      PRODUCT_NAME: Tailboard
      MARKETING_VERSION: 2.0
      CURRENT_PROJECT_VERSION: 15
      INFOPLIST_FILE: TailboardMacHost/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: true

schemes:
  Tailboard:
    build:
      targets:
        Tailboard: all
